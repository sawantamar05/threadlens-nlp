name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install locked lightweight dependencies
        run: |
          uv venv
          uv pip sync requirements-ci.lock
          uv pip install --no-deps -e .
      - name: Lint and formatting
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: CPU tests without network or pretrained model download
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: .venv/bin/pytest -q
      - name: Offline demo rebuild and reload
        run: |
          .venv/bin/threadlens demo
          THREADLENS_ROOT="$PWD/.local/demo" .venv/bin/threadlens predict "Could you explain this configuration?"
